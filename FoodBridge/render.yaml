services:
  # ==============================================================================
  # FoodBridge Backend Web Service (Spring Boot 3 + Java 17)
  # ==============================================================================
  - type: web
    name: foodbridge-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: foodbridge-db
          property: connectionString
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:5500,http://127.0.0.1:5500"
      - key: JWT_SECRET
        generateValue: true

  # ==============================================================================
  # FoodBridge Frontend Web Service (Nginx + HTML/CSS/JS)
  # ==============================================================================
  - type: web
    name: foodbridge-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: BACKEND_URL
        fromService:
          type: web
          name: foodbridge-backend
          property: host

# ==============================================================================
# Managed PostgreSQL Database (Render Free Tier)
# ==============================================================================
databases:
  - name: foodbridge-db
    databaseName: foodbridge
    user: foodbridge_user
    plan: free
