<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading p-3 border-bottom">
                <a href="../index.html" class="text-decoration-none">
                    <i class="bi bi-heart-fill text-danger me-2"></i>
                    <span class="fw-bold fs-5 text-success">FoodBridge</span>
                </a>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="donor-dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="create-donation.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-plus-circle me-2"></i>Create Donation
                </a>
                <a href="my-donations.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-box-seam me-2"></i>My Donations
                </a>
                <a href="requests.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-inbox me-2"></i>Requests
                </a>
                <a href="donor-profile.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-person me-2"></i>Profile
                </a>
            </div>
            <div class="p-3 border-top">
                <button class="btn btn-outline-danger w-100" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </aside>

        <div class="flex-fill" id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid px-4">
                    <button class="btn btn-link text-decoration-none d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h4 class="fw-bold mb-0 ms-2">Requests</h4>
                </div>
            </nav>

            <main class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="mb-0">All Requests</h5>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0" id="requests-table">
                                <thead class="table-light">
                                    <tr>
                                        <th>Donation</th>
                                        <th>NGO</th>
                                        <th>Requested</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                        <div class="text-center p-4 d-none" id="empty-state">
                            <div class="empty-state">
                                <i class="bi bi-inbox empty-state-icon"></i>
                                <h6 class="empty-state-title">No requests yet</h6>
                                <p class="empty-state-text">Requests from NGOs will appear here</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth(['DONOR'])) return;
            updateAuthUI();
            initSidebar();
            loadRequests();
        });

        function initSidebar() {
            const toggle = document.getElementById('sidebar-toggle');
            const wrapper = document.getElementById('wrapper');
            if (toggle) toggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
        }

        async function loadRequests() {
            try {
                const requests = await api.get('/requests/my-requests');
                renderRequests(requests);
            } catch (error) {
                showToast('Failed to load requests: ' + error.message, 'danger');
            }
        }

        function renderRequests(requests) {
            const tbody = document.querySelector('#requests-table tbody');
            const emptyDiv = document.getElementById('empty-state');

            if (!requests || requests.length === 0) {
                tbody.innerHTML = '';
                emptyDiv.classList.remove('d-none');
                return;
            }

            emptyDiv.classList.add('d-none');
            tbody.innerHTML = requests.map(r => `
                <tr>
                    <td>
                        <strong>${escapeHtml(r.donationFoodName)}</strong>
                        <div class="text-muted small">${escapeHtml(r.pickupAddress || '')}</div>
                    </td>
                    <td>
                        <div>${escapeHtml(r.receiverName)}</div>
                        <div class="text-muted small">${escapeHtml(r.receiverEmail)}</div>
                    </td>
                    <td>${r.requestedQuantity} ${escapeHtml(r.unit || 'portions')}</td>
                    <td>${formatDate(r.requestedAt)}</td>
                    <td><span class="badge badge-${getStatusBadgeClass(r.status)}">${getStatusLabel(r.status)}</span></td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <a href="donation-details.html?id=${r.donationId}" class="btn btn-outline-primary">View</a>
                            ${r.status === 'PENDING' ? `
                                <button class="btn btn-success" onclick="approveRequest('${r.id}')"><i class="bi bi-check"></i></button>
                                <button class="btn btn-danger" onclick="rejectRequest('${r.id}')"><i class="bi bi-x"></i></button>
                            ` : ''}
                            ${r.status === 'APPROVED' ? `
                                <button class="btn btn-info" onclick="collectFood('${r.id}')"><i class="bi bi-truck"></i></button>
                            ` : ''}
                            ${r.status === 'COLLECTED' ? `
                                <button class="btn btn-success" onclick="completeRequest('${r.id}')"><i class="bi bi-check-circle"></i></button>
                            ` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function approveRequest(id) {
            if (!confirm('Approve this request?')) return;
            try {
                await api.patch(`/requests/${id}/approve`);
                showToast('Request approved', 'success');
                loadRequests();
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }

        async function rejectRequest(id) {
            if (!confirm('Reject this request?')) return;
            try {
                await api.patch(`/requests/${id}/reject`);
                showToast('Request rejected', 'success');
                loadRequests();
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }

        async function collectFood(id) {
            const quantity = prompt('Enter collected quantity:');
            if (!quantity || isNaN(quantity)) return;
            
            try {
                await api.patch(`/requests/${id}/collect`, { collectedQuantity: parseInt(quantity) });
                showToast('Food marked as collected', 'success');
                loadRequests();
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }

        async function completeRequest(id) {
            if (!confirm('Mark this request as completed?')) return;
            try {
                await api.patch(`/requests/${id}/complete`);
                showToast('Request completed', 'success');
                loadRequests();
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }
    </script>
</body>
</html>
