<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Organizations - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading p-3 border-bottom">
                <a href="../index.html" class="text-decoration-none">
                    <i class="bi bi-heart-fill text-danger me-2"></i>
                    <span class="fw-bold fs-5 text-success">FoodBridge</span>
                </a>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="admin-dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="manage-users.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-people me-2"></i>Manage Users
                </a>
                <a href="manage-organizations.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-building me-2"></i>Manage Organizations
                </a>
                <a href="manage-donations.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-box-seam me-2"></i>Manage Donations
                </a>
                <a href="manage-requests.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-inbox me-2"></i>Manage Requests
                </a>
                <a href="reports.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-graph-up me-2"></i>Reports
                </a>
            </div>
            <div class="p-3 border-top">
                <button class="btn btn-outline-danger w-100" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </aside>

        <div class="flex-fill" id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid px-4">
                    <button class="btn btn-link text-decoration-none d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h4 class="fw-bold mb-0 ms-2">Manage Organizations</h4>
                </div>
            </nav>

            <main class="p-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <form id="filter-form" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label" for="search">Search</label>
                                <input type="text" class="form-control" id="search" name="search" placeholder="Organization name...">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="status">Verification Status</label>
                                <select class="form-select form-control" id="status" name="status">
                                    <option value="">All Status</option>
                                    <option value="PENDING">Pending</option>
                                    <option value="VERIFIED">Verified</option>
                                    <option value="REJECTED">Rejected</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Filter</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-0" id="orgs-container">
                        <div class="text-center py-5">
                            <div class="spinner spinner-lg mx-auto"></div>
                            <p class="text-muted mt-3">Loading organizations...</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth(['ADMIN'])) return;
            updateAuthUI();
            initSidebar();
            loadOrgs();
            document.getElementById('filter-form').addEventListener('submit', handleFilter);
        });

        function initSidebar() {
            const toggle = document.getElementById('sidebar-toggle');
            const wrapper = document.getElementById('wrapper');
            if (toggle) toggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
        }

        async function loadOrgs() {
            const container = document.getElementById('orgs-container');
            container.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner spinner-lg mx-auto"></div>
                    <p class="text-muted mt-3">Loading organizations...</p>
                </div>
            `;

            try {
                const params = new URLSearchParams();
                if (currentFilters.search) params.append('search', currentFilters.search);
                if (currentFilters.status) params.append('status', currentFilters.status);

                const orgs = await api.get(`/organizations?${params.toString()}`);
                renderOrgs(orgs);
            } catch (error) {
                container.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">Failed to load organizations</h5>
                        <p class="text-muted">${error.message}</p>
                        <button class="btn btn-primary mt-3" onclick="loadOrgs()">Retry</button>
                    </div>
                `;
            }
        }

        let currentFilters = {};

        function handleFilter(e) {
            e.preventDefault();
            currentFilters = {
                search: document.getElementById('search').value.trim(),
                status: document.getElementById('status').value
            };
            loadOrgs();
        }

        function renderOrgs(orgs) {
            const container = document.getElementById('orgs-container');

            if (!orgs || orgs.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-building text-muted" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">No organizations found</h5>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Organization</th>
                                <th>Contact</th>
                                <th>Location</th>
                                <th>Registration</th>
                                <th>Status</th>
                                <th>User</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${orgs.map(o => `
                                <tr>
                                    <td><strong>${escapeHtml(o.organizationName)}</strong></td>
                                    <td>${escapeHtml(o.contactNumber || '-')}</td>
                                    <td>${escapeHtml(o.city || '')}, ${escapeHtml(o.state || '')}</td>
                                    <td>${escapeHtml(o.registrationNumber || '-')}</td>
                                    <td><span class="badge ${getVerificationBadgeClass(o.verificationStatus)}">${o.verificationStatus}</span></td>
                                    <td>${escapeHtml(o.user?.email || '-')}</td>
                                    <td>${formatDateOnly(o.createdAt)}</td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            ${o.verificationStatus === 'PENDING' ? `
                                                <button class="btn btn-success" onclick="verifyOrg('${o.id}', 'VERIFIED')">Verify</button>
                                                <button class="btn btn-danger" onclick="verifyOrg('${o.id}', 'REJECTED')">Reject</button>
                                            ` : o.verificationStatus === 'VERIFIED' ? `
                                                <button class="btn btn-warning" onclick="verifyOrg('${o.id}', 'PENDING')">Set Pending</button>
                                            ` : ''}
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function getVerificationBadgeClass(status) {
            switch (status) {
                case 'VERIFIED': return 'bg-success';
                case 'PENDING': return 'bg-warning text-dark';
                case 'REJECTED': return 'bg-danger';
                default: return 'bg-secondary';
            }
        }

        async function verifyOrg(id, status) {
            const action = status === 'VERIFIED' ? 'verify' : status === 'REJECTED' ? 'reject' : 'set to pending';
            if (!confirm(`${action.charAt(0).toUpperCase() + action.slice(1)} this organization?`)) return;
            try {
                await api.patch(`/organizations/${id}/verify`, { verificationStatus: status });
                showToast(`Organization ${status.toLowerCase()}`, 'success');
                loadOrgs();
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }
    </script>
</body>
</html>
