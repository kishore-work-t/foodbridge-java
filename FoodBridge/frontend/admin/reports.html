<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading p-3 border-bottom">
                <a href="../index.html" class="text-decoration-none">
                    <i class="bi bi-heart-fill text-danger me-2"></i>
                    <span class="fw-bold fs-5 text-success">FoodBridge</span>
                </a>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="admin-dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="manage-users.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-people me-2"></i>Manage Users
                </a>
                <a href="manage-organizations.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-building me-2"></i>Manage Organizations
                </a>
                <a href="manage-donations.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-box-seam me-2"></i>Manage Donations
                </a>
                <a href="manage-requests.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-inbox me-2"></i>Manage Requests
                </a>
                <a href="reports.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-graph-up me-2"></i>Reports
                </a>
            </div>
            <div class="p-3 border-top">
                <button class="btn btn-outline-danger w-100" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </aside>

        <div class="flex-fill" id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid px-4">
                    <button class="btn btn-link text-decoration-none d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h4 class="fw-bold mb-0 ms-2">Reports & Analytics</h4>
                </div>
            </nav>

            <main class="p-4">
                <div class="row g-4 mb-4">
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                                    <i class="bi bi-box-seam fs-3"></i>
                                </div>
                                <h3 class="fw-bold" id="rpt-total-donations">0</h3>
                                <p class="text-muted small mb-0">Total Donations</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <div class="bg-info bg-opacity-10 text-info rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                                    <i class="bi bi-check-circle fs-3"></i>
                                </div>
                                <h3 class="fw-bold" id="rpt-completed">0</h3>
                                <p class="text-muted small mb-0">Completed</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                                    <i class="bi bi-inbox fs-3"></i>
                                </div>
                                <h3 class="fw-bold" id="rpt-pending">0</h3>
                                <p class="text-muted small mb-0">Pending Requests</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                                    <i class="bi bi-truck fs-3"></i>
                                </div>
                                <h3 class="fw-bold" id="rpt-collections">0</h3>
                                <p class="text-muted small mb-0">Collections</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-xl-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-header">
                                <h5 class="mb-0">Donations by Status</h5>
                            </div>
                            <div class="card-body" id="donations-by-status">
                                <div class="text-center py-4">
                                    <div class="spinner spinner-sm mx-auto"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-header">
                                <h5 class="mb-0">Requests by Status</h5>
                            </div>
                            <div class="card-body" id="requests-by-status">
                                <div class="text-center py-4">
                                    <div class="spinner spinner-sm mx-auto"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-xl-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-header">
                                <h5 class="mb-0">Top Donors</h5>
                            </div>
                            <div class="card-body p-0" id="top-donors">
                                <div class="text-center py-4">
                                    <div class="spinner spinner-sm mx-auto"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-header">
                                <h5 class="mb-0">Top NGOs (by Collections)</h5>
                            </div>
                            <div class="card-body p-0" id="top-ngos">
                                <div class="text-center py-4">
                                    <div class="spinner spinner-sm mx-auto"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0">Food Types Distribution</h5>
                    </div>
                    <div class="card-body" id="food-types">
                        <div class="text-center py-4">
                            <div class="spinner spinner-sm mx-auto"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth(['ADMIN'])) return;
            updateAuthUI();
            initSidebar();
            loadReports();
        });

        function initSidebar() {
            const toggle = document.getElementById('sidebar-toggle');
            const wrapper = document.getElementById('wrapper');
            if (toggle) toggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
        }

        async function loadReports() {
            try {
                const [dashboard, donations, requests] = await Promise.all([
                    api.get('/dashboard/admin'),
                    api.get('/donations'),
                    api.get('/requests')
                ]);

                document.getElementById('rpt-total-donations').textContent = dashboard.totalDonations || 0;
                document.getElementById('rpt-completed').textContent = dashboard.completedDonations || 0;
                document.getElementById('rpt-pending').textContent = dashboard.pendingRequests || 0;
                document.getElementById('rpt-collections').textContent = dashboard.completedCollections || 0;

                renderDonationsByStatus(donations);
                renderRequestsByStatus(requests);
                renderTopDonors(donations);
                renderTopNGOs(requests);
                renderFoodTypes(donations);
            } catch (error) {
                showToast('Failed to load reports: ' + error.message, 'danger');
            }
        }

        function renderDonationsByStatus(donations) {
            const container = document.getElementById('donations-by-status');
            const statusCounts = {};
            donations.forEach(d => {
                statusCounts[d.status] = (statusCounts[d.status] || 0) + 1;
            });

            container.innerHTML = Object.entries(statusCounts).map(([status, count]) => `
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                    <span><span class="badge badge-${getStatusBadgeClass(status)} me-2">${getStatusLabel(status)}</span>${status}</span>
                    <strong>${count}</strong>
                </div>
            `).join('');
        }

        function renderRequestsByStatus(requests) {
            const container = document.getElementById('requests-by-status');
            const statusCounts = {};
            requests.forEach(r => {
                statusCounts[r.status] = (statusCounts[r.status] || 0) + 1;
            });

            container.innerHTML = Object.entries(statusCounts).map(([status, count]) => `
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                    <span><span class="badge badge-${getStatusBadgeClass(status)} me-2">${getStatusLabel(status)}</span>${status}</span>
                    <strong>${count}</strong>
                </div>
            `).join('');
        }

        function renderTopDonors(donations) {
            const container = document.getElementById('top-donors');
            const donorCounts = {};
            donations.forEach(d => {
                if (d.donorName) {
                    donorCounts[d.donorName] = (donorCounts[d.donorName] || 0) + 1;
                }
            });

            const sorted = Object.entries(donorCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

            if (sorted.length === 0) {
                container.innerHTML = '<div class="p-3 text-center text-muted">No donor data</div>';
                return;
            }

            container.innerHTML = sorted.map(([name, count], index) => `
                <div class="border-bottom p-3 d-flex align-items-center">
                    <span class="badge bg-primary me-3">${index + 1}</span>
                    <div class="flex-1">
                        <strong>${escapeHtml(name)}</strong>
                        <div class="text-muted small">${count} donations</div>
                    </div>
                </div>
            `).join('');
        }

        function renderTopNGOs(requests) {
            const container = document.getElementById('top-ngos');
            const ngoCounts = {};
            requests.filter(r => r.status === 'COMPLETED' || r.status === 'COLLECTED').forEach(r => {
                if (r.receiverName) {
                    ngoCounts[r.receiverName] = (ngoCounts[r.receiverName] || 0) + 1;
                }
            });

            const sorted = Object.entries(ngoCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

            if (sorted.length === 0) {
                container.innerHTML = '<div class="p-3 text-center text-muted">No NGO data</div>';
                return;
            }

            container.innerHTML = sorted.map(([name, count], index) => `
                <div class="border-bottom p-3 d-flex align-items-center">
                    <span class="badge bg-success me-3">${index + 1}</span>
                    <div class="flex-1">
                        <strong>${escapeHtml(name)}</strong>
                        <div class="text-muted small">${count} collections</div>
                    </div>
                </div>
            `).join('');
        }

        function renderFoodTypes(donations) {
            const container = document.getElementById('food-types');
            const typeCounts = {};
            donations.forEach(d => {
                typeCounts[d.foodType] = (typeCounts[d.foodType] || 0) + 1;
            });

            const sorted = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]);

            container.innerHTML = `
                <div class="row g-3">
                    ${sorted.map(([type, count]) => `
                        <div class="col-md-4 col-sm-6">
                            <div class="card">
                                <div class="card-body text-center py-3">
                                    <h6 class="mb-1">${escapeHtml(type)}</h6>
                                    <div class="display-6 fw-bold text-success">${count}</div>
                                    <small class="text-muted">donations</small>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
    </script>
</body>
</html>
