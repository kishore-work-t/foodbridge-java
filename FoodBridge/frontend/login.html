<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-success" href="index.html">
                <i class="bi bi-heart-fill text-danger me-2"></i>FoodBridge
            </a>
        </div>
    </nav>

    <main class="min-vh-100 d-flex align-items-center py-5" style="margin-top: 72px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold">Welcome Back</h2>
                                <p class="text-muted">Sign in to your FoodBridge account</p>
                            </div>

                            <form id="login-form" novalidate>
                                <div class="form-group">
                                    <label class="form-label" for="email">Email Address</label>
                                    <input type="email" class="form-control" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
                                    <div class="form-error" id="email-error"></div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="password">Password</label>
                                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                                    <div class="form-error" id="password-error"></div>
                                </div>

                                <div class="form-group d-flex justify-content-between align-items-center">
                                    <label class="form-check mb-0">
                                        <input type="checkbox" class="form-check-input" id="remember">
                                        <span class="form-check-label small">Remember me</span>
                                    </label>
                                    <a href="#" class="small text-decoration-none">Forgot password?</a>
                                </div>

                                <button type="submit" class="btn btn-success w-100 mt-2" id="login-btn">
                                    <span class="btn-text">Sign In</span>
                                    <span class="btn-loading d-none"><span class="spinner spinner-sm me-2"></span>Signing in...</span>
                                </button>
                            </form>

                            <div class="text-center mt-4">
                                <p class="text-muted mb-0">Don't have an account? 
                                    <a href="register.html" class="fw-medium">Register</a>
                                </p>
                            </div>

                            <hr class="my-4">

                            <div class="text-center">
                                <p class="text-muted small mb-2">Demo Credentials (password: password123)</p>
                                <div class="d-grid gap-2">
                                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillDemo('admin@foodbridge.com')">
                                        <i class="bi bi-person-badge me-1"></i> Admin
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillDemo('donor1@foodbridge.com')">
                                        <i class="bi bi-restaurant me-1"></i> Donor
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillDemo('receiver1@foodbridge.com')">
                                        <i class="bi bi-people me-1"></i> Verified NGO
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillDemo('pending@foodbridge.com')">
                                        <i class="bi bi-hourglass me-1"></i> Pending NGO
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-3 mt-auto">
        <div class="container text-center text-muted small">
            FoodBridge - College Project Demonstration
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            const form = document.getElementById('login-form');
            form.addEventListener('submit', handleLogin);
        });

        function fillDemo(email) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = 'password123';
        }

        async function handleLogin(e) {
            e.preventDefault();
            clearErrors();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoading = btn.querySelector('.btn-loading');

            if (!validateEmail(email)) {
                showError('email', 'Please enter a valid email address');
                return;
            }

            if (!password) {
                showError('password', 'Password is required');
                return;
            }

            btn.disabled = true;
            btnText.classList.add('d-none');
            btnLoading.classList.remove('d-none');

            try {
                const response = await api.post('/auth/login', { email, password });
                api.setAuth(response.token, {
                    id: response.id,
                    name: response.name,
                    email: response.email,
                    role: response.role,
                    status: response.status
                });
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => redirectByRole(response.role), 1000);
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                btn.disabled = false;
                btnText.classList.remove('d-none');
                btnLoading.classList.add('d-none');
            }
        }

        function redirectByRole(role) {
            switch (role) {
                case 'ADMIN':
                    window.location.href = 'admin/admin-dashboard.html';
                    break;
                case 'DONOR':
                    window.location.href = 'donor/donor-dashboard.html';
                    break;
                case 'RECEIVER':
                    window.location.href = 'receiver/receiver-dashboard.html';
                    break;
                default:
                    window.location.href = 'index.html';
            }
        }

        function showError(field, message) {
            const input = document.getElementById(field);
            const errorDiv = document.getElementById(`${field}-error`);
            input.classList.add('is-invalid');
            if (errorDiv) errorDiv.textContent = message;
        }

        function clearErrors() {
            document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
        }
    </script>
</body>
</html>
