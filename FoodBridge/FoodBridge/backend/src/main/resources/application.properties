# FoodBridge Application Configuration

# Server Configuration (Render binds via dynamic $PORT, defaults to 8080)
server.port=${PORT:8080}

# Database Configuration (Supports MySQL and PostgreSQL on Render / Docker / Localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/foodbridge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_MYSQL_PASSWORD_HERE}

# JPA/Hibernate Configuration (Dialect is automatically detected by Hibernate for MySQL or PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# JWT Configuration (256-bit Base64 default key, overridable with JWT_SECRET env var)
app.jwt.secret=${JWT_SECRET:Zm9vZGJyaWRnZS1zdXBlci1zZWNyZXQta2V5LTI1Ni1iaXQtdG9rZW4tcHJvZHVjdGlvbiE=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration (Comma-separated origins, also supports wildcard patterns like https://*.onrender.com)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# File Upload (if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.foodbridge=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN