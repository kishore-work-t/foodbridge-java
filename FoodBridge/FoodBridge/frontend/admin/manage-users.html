<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading p-3 border-bottom">
                <a href="../index.html" class="text-decoration-none">
                    <i class="bi bi-heart-fill text-danger me-2"></i>
                    <span class="fw-bold fs-5 text-success">FoodBridge</span>
                </a>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="admin-dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="manage-users.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-people me-2"></i>Manage Users
                </a>
                <a href="manage-organizations.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-building me-2"></i>Manage Organizations
                </a>
                <a href="manage-donations.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-box-seam me-2"></i>Manage Donations
                </a>
                <a href="manage-requests.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-inbox me-2"></i>Manage Requests
                </a>
                <a href="reports.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-graph-up me-2"></i>Reports
                </a>
            </div>
            <div class="p-3 border-top">
                <button class="btn btn-outline-danger w-100" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </aside>

        <div class="flex-fill" id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid px-4">
                    <button class="btn btn-link text-decoration-none d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h4 class="fw-bold mb-0 ms-2">Manage Users</h4>
                </div>
            </nav>

            <main class="p-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <form id="filter-form" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label" for="search">Search</label>
                                <input type="text" class="form-control" id="search" name="search" placeholder="Name or email...">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="role">Role</label>
                                <select class="form-select form-control" id="role" name="role">
                                    <option value="">All Roles</option>
                                    <option value="ADMIN">Admin</option>
                                    <option value="DONOR">Donor</option>
                                    <option value="RECEIVER">Receiver</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="status">Status</label>
                                <select class="form-select form-control" id="status" name="status">
                                    <option value="">All Status</option>
                                    <option value="ACTIVE">Active</option>
                                    <option value="INACTIVE">Inactive</option>
                                    <option value="SUSPENDED">Suspended</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Filter</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-0" id="users-table-container">
                        <div class="text-center py-5">
                            <div class="spinner spinner-lg mx-auto"></div>
                            <p class="text-muted mt-3">Loading users...</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth(['ADMIN'])) return;
            updateAuthUI();
            initSidebar();
            loadUsers();
            document.getElementById('filter-form').addEventListener('submit', handleFilter);
        });

        function initSidebar() {
            const toggle = document.getElementById('sidebar-toggle');
            const wrapper = document.getElementById('wrapper');
            if (toggle) toggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
        }

        let currentPage = 0;
        let currentFilters = {};

        async function loadUsers(page = 0) {
            currentPage = page;
            const container = document.getElementById('users-table-container');
            container.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner spinner-lg mx-auto"></div>
                    <p class="text-muted mt-3">Loading users...</p>
                </div>
            `;

            try {
                const params = new URLSearchParams();
                params.append('page', page);
                params.append('size', 20);
                if (currentFilters.search) params.append('search', currentFilters.search);
                if (currentFilters.role) params.append('role', currentFilters.role);
                if (currentFilters.status) params.append('status', currentFilters.status);

                const response = await api.get(`/users?${params.toString()}`);
                const users = response.content || response;
                const totalPages = response.totalPages || 1;
                const totalElements = response.totalElements || users.length;

                renderUsers(users, page, totalPages, totalElements);
            } catch (error) {
                container.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">Failed to load users</h5>
                        <p class="text-muted">${error.message}</p>
                        <button class="btn btn-primary mt-3" onclick="loadUsers(${page})">Retry</button>
                    </div>
                `;
            }
        }

        function handleFilter(e) {
            e.preventDefault();
            currentFilters = {
                search: document.getElementById('search').value.trim(),
                role: document.getElementById('role').value,
                status: document.getElementById('status').value
            };
            loadUsers(0);
        }

        function renderUsers(users, page, totalPages, totalElements) {
            const container = document.getElementById('users-table-container');

            if (!users || users.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-people text-muted" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">No users found</h5>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            users.forEach(u => {
                html += `
                    <tr>
                        <td><strong>${escapeHtml(u.name)}</strong></td>
                        <td>${escapeHtml(u.email)}</td>
                        <td>${escapeHtml(u.phone || '-')}</td>
                        <td><span class="badge badge-${getStatusBadgeClass(u.role)}">${u.role}</span></td>
                        <td><span class="badge badge-${getStatusBadgeClass(u.status)}">${u.status}</span></td>
                        <td>${formatDateOnly(u.createdAt)}</td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                ${u.status !== 'SUSPENDED' ? `
                                    <button class="btn btn-outline-warning" onclick="updateStatus('${u.id}', 'SUSPENDED')" title="Suspend">
                                        <i class="bi bi-pause-circle"></i>
                                    </button>
                                ` : ''}
                                ${u.status !== 'ACTIVE' ? `
                                    <button class="btn btn-outline-success" onclick="updateStatus('${u.id}', 'ACTIVE')" title="Activate">
                                        <i class="bi bi-play-circle"></i>
                                    </button>
                                ` : ''}
                                <button class="btn btn-outline-danger" onclick="confirmDelete('${u.id}', '${escapeHtml(u.name)}')" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            if (totalPages > 1) {
                html += `
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <span class="text-muted small">Showing ${page * 20 + 1} - ${Math.min((page + 1) * 20, totalElements)} of ${totalElements} users</span>
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item ${page === 0 ? 'disabled' : ''}">
                                    <button class="page-link" onclick="loadUsers(${page - 1})" ${page === 0 ? 'disabled' : ''}>Previous</button>
                                </li>
            `;
                for (let i = 0; i < totalPages; i++) {
                    if (i === page || i === 0 || i === totalPages - 1 || (i >= page - 1 && i <= page + 1)) {
                        html += `<li class="page-item ${i === page ? 'active' : ''}"><button class="page-link" onclick="loadUsers(${i})">${i + 1}</button></li>`;
                    } else if (i === page - 2 || i === page + 2) {
                        html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                    }
                }
                html += `
                                <li class="page-item ${page === totalPages - 1 ? 'disabled' : ''}">
                                    <button class="page-link" onclick="loadUsers(${page + 1})" ${page === totalPages - 1 ? 'disabled' : ''}>Next</button>
                                </li>
                            </ul>
                        </nav>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        async function updateStatus(id, status) {
            if (!confirm(`Are you sure you want to ${status.toLowerCase()} this user?`)) return;
            try {
                await api.patch(`/users/${id}/status`, { status });
                showToast(`User ${status.toLowerCase()}`, 'success');
                loadUsers(currentPage);
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }

        function confirmDelete(id, name) {
            if (confirm(`Delete user "${name}"? This action cannot be undone.`)) {
                deleteUser(id);
            }
        }

        async function deleteUser(id) {
            try {
                await api.delete(`/users/${id}`);
                showToast('User deleted', 'success');
                loadUsers(currentPage);
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }
    </script>
</body>
</html>
