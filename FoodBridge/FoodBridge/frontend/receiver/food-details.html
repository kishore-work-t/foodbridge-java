<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Details - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading p-3 border-bottom">
                <a href="../index.html" class="text-decoration-none">
                    <i class="bi bi-heart-fill text-danger me-2"></i>
                    <span class="fw-bold fs-5 text-success">FoodBridge</span>
                </a>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="receiver-dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="available-food.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-search-heart me-2"></i>Available Food
                </a>
                <a href="my-requests.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-inbox me-2"></i>My Requests
                </a>
                <a href="collection-history.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-truck me-2"></i>Collection History
                </a>
                <a href="receiver-profile.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-person me-2"></i>Profile
                </a>
            </div>
            <div class="p-3 border-top">
                <button class="btn btn-outline-danger w-100" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </aside>

        <div class="flex-fill" id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid px-4">
                    <button class="btn btn-link text-decoration-none d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h4 class="fw-bold mb-0 ms-2">Food Details</h4>
                </div>
            </nav>

            <main class="p-4">
                <div id="food-content">
                    <div class="text-center py-5">
                        <div class="spinner spinner-lg mx-auto"></div>
                        <p class="text-muted mt-3">Loading food details...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth(['RECEIVER'])) return;
            updateAuthUI();
            initSidebar();
            loadFoodDetails();
        });

        function initSidebar() {
            const toggle = document.getElementById('sidebar-toggle');
            const wrapper = document.getElementById('wrapper');
            if (toggle) toggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
        }

        async function loadFoodDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (!id) {
                showToast('Food ID not found', 'danger');
                setTimeout(() => window.location.href = 'available-food.html', 2000);
                return;
            }

            try {
                const food = await api.get(`/donations/${id}`);
                renderFoodDetails(food);
            } catch (error) {
                document.getElementById('food-content').innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">Failed to load food details</h5>
                        <p class="text-muted">${error.message}</p>
                        <a href="available-food.html" class="btn btn-primary mt-3">Back to Available Food</a>
                    </div>
                `;
            }
        }

        function renderFoodDetails(d) {
            const canRequest = d.status === 'AVAILABLE' || d.status === 'REQUESTED' || d.status === 'PARTIALLY_RESERVED';
            const isExpired = d.isExpired;

            document.getElementById('food-content').innerHTML = `
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card shadow-sm">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">${escapeHtml(d.foodName)}</h5>
                                <span class="badge badge-${getStatusBadgeClass(d.status)}">${getStatusLabel(d.status)}${isExpired ? ' (EXPIRED)' : ''}</span>
                            </div>
                            <div class="card-body">
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Food Type</label>
                                        <p class="mb-0">${escapeHtml(d.foodType)}</p>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Unit</label>
                                        <p class="mb-0">${escapeHtml(d.unit)}</p>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-muted small">Total Quantity</label>
                                        <p class="mb-0 fw-bold">${d.quantity} ${escapeHtml(d.unit)}</p>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-muted small">Available</label>
                                        <p class="mb-0 fw-bold text-success">${d.availableQuantity} ${escapeHtml(d.unit)}</p>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-muted small">Reserved</label>
                                        <p class="mb-0 fw-bold text-warning">${d.reservedQuantity} ${escapeHtml(d.unit)}</p>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Preparation Time</label>
                                        <p class="mb-0">${formatDate(d.preparationTime)}</p>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Expiry Time</label>
                                        <p class="mb-0 ${isExpired ? 'text-danger' : ''}">${formatDate(d.expiryTime)} ${isExpired ? '<span class="badge badge-danger ms-2">EXPIRED</span>' : ''}</p>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label text-muted small">Pickup Address</label>
                                        <p class="mb-0">${escapeHtml(d.pickupAddress)}</p>
                                    </div>
                                    ${d.description ? `
                                        <div class="col-12">
                                            <label class="form-label text-muted small">Description</label>
                                            <p class="mb-0">${escapeHtml(d.description)}</p>
                                        </div>
                                    ` : ''}
                                </div>

                                ${d.items && d.items.length > 0 ? `
                                    <hr>
                                    <h6 class="fw-bold mb-3">Food Items</h6>
                                    <div class="table-responsive">
                                        <table class="table table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Item</th>
                                                    <th>Quantity</th>
                                                    <th>Unit</th>
                                                    <th>Description</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${d.items.map(item => `
                                                    <tr>
                                                        <td>${escapeHtml(item.itemName)}</td>
                                                        <td>${item.quantity}</td>
                                                        <td>${escapeHtml(item.unit)}</td>
                                                        <td>${escapeHtml(item.description || '-')}</td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                ` : ''}

                                <div class="d-flex gap-2 mt-4">
                                    ${canRequest && !isExpired ? `
                                        <button class="btn btn-success btn-lg flex-fill" onclick="openRequestModal()">
                                            <i class="bi bi-heart me-2"></i>Request This Food
                                        </button>
                                    ` : isExpired ? `
                                        <button class="btn btn-secondary btn-lg flex-fill" disabled>
                                            <i class="bi bi-x-circle me-2"></i>Expired - Cannot Request
                                        </button>
                                    ` : `
                                        <button class="btn btn-secondary btn-lg flex-fill" disabled>
                                            <i class="bi bi-lock me-2"></i>Not Available for Request
                                        </button>
                                    `}
                                    <a href="available-food.html" class="btn btn-outline-secondary">Back</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="card shadow-sm">
                            <div class="card-header">
                                <h5 class="mb-0">Donor Information</h5>
                            </div>
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
                                        <i class="bi bi-person fs-4"></i>
                                    </div>
                                    <div>
                                        <h6 class="mb-0">${escapeHtml(d.donorName || 'Unknown')}</h6>
                                        <small class="text-muted">Food Donor</small>
                                    </div>
                                </div>
                                <div class="text-muted small">
                                    <p class="mb-1"><i class="bi bi-building me-2"></i>Donor ID: ${d.donorId}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function openRequestModal() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            // We need to get the food data again for the modal
            // For simplicity, we'll redirect to available-food with a flag
            window.location.href = `available-food.html?request=${id}`;
        }
    </script>
</body>
</html>
