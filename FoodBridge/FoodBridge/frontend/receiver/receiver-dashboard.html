<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiver Dashboard - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading p-3 border-bottom">
                <a href="../index.html" class="text-decoration-none">
                    <i class="bi bi-heart-fill text-danger me-2"></i>
                    <span class="fw-bold fs-5 text-success">FoodBridge</span>
                </a>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="receiver-dashboard.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="available-food.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-search-heart me-2"></i>Available Food
                </a>
                <a href="my-requests.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-inbox me-2"></i>My Requests
                </a>
                <a href="collection-history.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-truck me-2"></i>Collection History
                </a>
                <a href="receiver-profile.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-person me-2"></i>Profile
                </a>
            </div>
            <div class="p-3 border-top">
                <button class="btn btn-outline-danger w-100" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </aside>

        <div class="flex-fill" id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid px-4">
                    <button class="btn btn-link text-decoration-none d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h4 class="fw-bold mb-0 ms-2">Receiver Dashboard</h4>
                    <div class="ms-auto d-flex align-items-center gap-3">
                        <span id="user-role" class="badge bg-info"></span>
                    </div>
                </div>
            </nav>

            <main class="p-4">
                <div id="alert-container"></div>

                <div class="row g-4 mb-4">
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <p class="text-muted small mb-1">Available Food</p>
                                        <h3 class="fw-bold mb-0" id="stat-available">0</h3>
                                    </div>
                                    <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                        <i class="bi bi-box-seam fs-4"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <p class="text-muted small mb-1">My Requests</p>
                                        <h3 class="fw-bold mb-0" id="stat-total">0</h3>
                                    </div>
                                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                        <i class="bi bi-inbox fs-4"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <p class="text-muted small mb-1">Pending</p>
                                        <h3 class="fw-bold mb-0" id="stat-pending">0</h3>
                                    </div>
                                    <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                        <i class="bi bi-clock fs-4"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <p class="text-muted small mb-1">Completed</p>
                                        <h3 class="fw-bold mb-0" id="stat-completed">0</h3>
                                    </div>
                                    <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                        <i class="bi bi-check-circle fs-4"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-xl-8">
                        <div class="card shadow-sm">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Available Food Near You</h5>
                                <a href="available-food.html" class="btn btn-sm btn-outline-primary">Browse All</a>
                            </div>
                            <div class="card-body p-0" id="available-food-list">
                                <div class="text-center py-4">
                                    <div class="spinner spinner-sm mx-auto"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-4">
                        <div class="card shadow-sm h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Recent Requests</h5>
                                <a href="my-requests.html" class="btn btn-sm btn-outline-primary">View All</a>
                            </div>
                            <div class="card-body p-0" id="recent-requests-list">
                                <div class="text-center py-4">
                                    <div class="spinner spinner-sm mx-auto"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth(['RECEIVER'])) return;
            updateAuthUI();
            initSidebar();
            loadDashboard();
        });

        function initSidebar() {
            const toggle = document.getElementById('sidebar-toggle');
            const wrapper = document.getElementById('wrapper');
            if (toggle) toggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
        }

        async function loadDashboard() {
            try {
                const [dashboard, food, requests] = await Promise.all([
                    api.get('/dashboard/receiver'),
                    api.get('/donations?page=0&size=5'),
                    api.get('/requests/my-requests')
                ]);

                document.getElementById('stat-available').textContent = dashboard.availableDonations || 0;
                document.getElementById('stat-total').textContent = dashboard.myRequests || 0;
                document.getElementById('stat-pending').textContent = dashboard.pendingRequests || 0;
                document.getElementById('stat-completed').textContent = dashboard.completedCollections || 0;

                renderAvailableFood(food.content ? food.content.slice(0, 5) : food.slice(0, 5));
                renderRecentRequests(requests.slice(0, 5));
            } catch (error) {
                showToast('Failed to load dashboard: ' + error.message, 'danger');
            }
        }

        function renderAvailableFood(food) {
            const container = document.getElementById('available-food-list');
            
            if (!food || food.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-4">
                        <i class="bi bi-box-seam text-muted" style="font-size: 2rem;"></i>
                        <p class="text-muted mt-2 mb-0">No food available at the moment</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = food.map(d => `
                <a href="food-details.html?id=${d.id}" class="d-block p-3 border-bottom text-decoration-none hover-bg-light">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1">${escapeHtml(d.foodName)}</h6>
                            <div class="text-muted small">
                                <i class="bi bi-tag me-1"></i>${escapeHtml(d.foodType)} | 
                                <i class="bi bi-box me-1"></i>${d.availableQuantity} ${escapeHtml(d.unit)} available
                            </div>
                            <div class="text-muted small">
                                <i class="bi bi-geo me-1"></i>${escapeHtml(d.pickupAddress)}
                            </div>
                        </div>
                        <span class="badge badge-${getStatusBadgeClass(d.status)}">${getStatusLabel(d.status)}</span>
                    </div>
                    <div class="mt-2 d-flex justify-content-between align-items-center">
                        <small class="text-muted">Expires: ${formatDate(d.expiryTime)}</small>
                        <span class="btn btn-success btn-sm">Request</span>
                    </div>
                </a>
            `).join('');
        }

        function renderRecentRequests(requests) {
            const container = document.getElementById('recent-requests-list');
            
            if (!requests || requests.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-4">
                        <i class="bi bi-inbox text-muted" style="font-size: 2rem;"></i>
                        <p class="text-muted mt-2 mb-0">No requests yet</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = requests.map(r => `
                <a href="food-details.html?id=${r.donationId}" class="d-block p-3 border-bottom text-decoration-none hover-bg-light">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1">${escapeHtml(r.donationFoodName)}</h6>
                            <div class="text-muted small">${r.requestedQuantity} ${escapeHtml(r.unit || 'portions')} requested</div>
                        </div>
                        <span class="badge badge-${getStatusBadgeClass(r.status)}">${getStatusLabel(r.status)}</span>
                    </div>
                    <small class="text-muted">Requested: ${formatDate(r.requestedAt)}</small>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
