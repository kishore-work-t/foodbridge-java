<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading p-3 border-bottom">
                <a href="../index.html" class="text-decoration-none">
                    <i class="bi bi-heart-fill text-danger me-2"></i>
                    <span class="fw-bold fs-5 text-success">FoodBridge</span>
                </a>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="receiver-dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="available-food.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-search-heart me-2"></i>Available Food
                </a>
                <a href="my-requests.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-inbox me-2"></i>My Requests
                </a>
                <a href="collection-history.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-truck me-2"></i>Collection History
                </a>
                <a href="receiver-profile.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-person me-2"></i>Profile
                </a>
            </div>
            <div class="p-3 border-top">
                <button class="btn btn-outline-danger w-100" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </aside>

        <div class="flex-fill" id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid px-4">
                    <button class="btn btn-link text-decoration-none d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h4 class="fw-bold mb-0 ms-2">My Requests</h4>
                </div>
            </nav>

            <main class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h5 class="mb-0">All Requests</h5>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-primary active" data-status="all">All</button>
                        <button type="button" class="btn btn-outline-primary" data-status="PENDING">Pending</button>
                        <button type="button" class="btn btn-outline-primary" data-status="APPROVED">Approved</button>
                        <button type="button" class="btn btn-outline-primary" data-status="COLLECTED">Collected</button>
                        <button type="button" class="btn btn-outline-primary" data-status="COMPLETED">Completed</button>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-0" id="requests-list">
                        <div class="text-center py-5">
                            <div class="spinner spinner-lg mx-auto"></div>
                            <p class="text-muted mt-3">Loading requests...</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth(['RECEIVER'])) return;
            updateAuthUI();
            initSidebar();
            initTabs();
            loadRequests();
        });

        function initSidebar() {
            const toggle = document.getElementById('sidebar-toggle');
            const wrapper = document.getElementById('wrapper');
            if (toggle) toggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
        }

        function initTabs() {
            document.querySelectorAll('[data-status]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadRequests(btn.dataset.status);
                });
            });
        }

        let currentStatus = 'all';

        async function loadRequests(status = 'all') {
            currentStatus = status;
            const container = document.getElementById('requests-list');
            container.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner spinner-lg mx-auto"></div>
                    <p class="text-muted mt-3">Loading requests...</p>
                </div>
            `;

            try {
                const requests = await api.get('/requests/my-requests');
                let filtered = requests;
                if (status !== 'all') {
                    filtered = requests.filter(r => r.status === status);
                }
                renderRequests(filtered);
            } catch (error) {
                container.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">Failed to load requests</h5>
                        <p class="text-muted">${error.message}</p>
                        <button class="btn btn-primary mt-3" onclick="loadRequests('${status}')">Retry</button>
                    </div>
                `;
            }
        }

        function renderRequests(requests) {
            const container = document.getElementById('requests-list');

            if (!requests || requests.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">${currentStatus === 'all' ? 'No requests yet' : `No ${currentStatus.toLowerCase()} requests`}</h5>
                        <p class="text-muted">${currentStatus === 'all' ? 'Start by browsing available food' : 'Try a different filter'}</p>
                        ${currentStatus === 'all' ? '<a href="available-food.html" class="btn btn-primary mt-3">Browse Food</a>' : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Food</th>
                                <th>Requested</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${requests.map(r => `
                                <tr>
                                    <td>
                                        <strong>${escapeHtml(r.donationFoodName)}</strong>
                                        <div class="text-muted small">${r.requestedQuantity} ${escapeHtml(r.unit || 'portions')}</div>
                                    </td>
                                    <td>
                                        <div>${formatDate(r.requestedAt)}</div>
                                        ${r.approvedAt ? `<div class="text-success small">Approved: ${formatDate(r.approvedAt)}</div>` : ''}
                                        ${r.rejectedAt ? `<div class="text-danger small">Rejected: ${formatDate(r.rejectedAt)}</div>` : ''}
                                    </td>
                                    <td><span class="badge badge-${getStatusBadgeClass(r.status)}">${getStatusLabel(r.status)}</span></td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <a href="food-details.html?id=${r.donationId}" class="btn btn-sm btn-outline-primary">View</a>
                                            ${r.status === 'PENDING' || r.status === 'APPROVED' ? `
                                                <button class="btn btn-sm btn-outline-danger" onclick="cancelRequest('${r.id}')">
                                                    <i class="bi bi-x"></i>
                                                </button>
                                            ` : ''}
                                            ${r.status === 'APPROVED' && r.collection ? `
                                                <button class="btn btn-sm btn-outline-success" onclick="markCollected('${r.id}')">
                                                    <i class="bi bi-truck"></i>
                                                </button>
                                            ` : ''}
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function cancelRequest(id) {
            if (!confirm('Cancel this request?')) return;
            try {
                await api.patch(`/requests/${id}/cancel`);
                showToast('Request cancelled', 'success');
                loadRequests(currentStatus);
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }

        async function markCollected(id) {
            const quantity = prompt('Enter collected quantity:');
            if (!quantity || isNaN(quantity)) return;
            
            try {
                await api.patch(`/requests/${id}/collect`, { collectedQuantity: parseInt(quantity) });
                showToast('Food marked as collected', 'success');
                loadRequests(currentStatus);
            } catch (error) {
                showToast(error.message, 'danger');
            }
        }
    </script>
</body>
</html>
