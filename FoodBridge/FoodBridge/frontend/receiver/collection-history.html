<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection History - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading p-3 border-bottom">
                <a href="../index.html" class="text-decoration-none">
                    <i class="bi bi-heart-fill text-danger me-2"></i>
                    <span class="fw-bold fs-5 text-success">FoodBridge</span>
                </a>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="receiver-dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="available-food.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-search-heart me-2"></i>Available Food
                </a>
                <a href="my-requests.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-inbox me-2"></i>My Requests
                </a>
                <a href="collection-history.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-truck me-2"></i>Collection History
                </a>
                <a href="receiver-profile.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-person me-2"></i>Profile
                </a>
            </div>
            <div class="p-3 border-top">
                <button class="btn btn-outline-danger w-100" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </aside>

        <div class="flex-fill" id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid px-4">
                    <button class="btn btn-link text-decoration-none d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h4 class="fw-bold mb-0 ms-2">Collection History</h4>
                </div>
            </nav>

            <main class="p-4">
                <div class="card shadow-sm">
                    <div class="card-body p-0" id="collections-list">
                        <div class="text-center py-5">
                            <div class="spinner spinner-lg mx-auto"></div>
                            <p class="text-muted mt-3">Loading collection history...</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth(['RECEIVER'])) return;
            updateAuthUI();
            initSidebar();
            loadCollections();
        });

        function initSidebar() {
            const toggle = document.getElementById('sidebar-toggle');
            const wrapper = document.getElementById('wrapper');
            if (toggle) toggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
        }

        async function loadCollections() {
            const container = document.getElementById('collections-list');
            container.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner spinner-lg mx-auto"></div>
                    <p class="text-muted mt-3">Loading collection history...</p>
                </div>
            `;

            try {
                const requests = await api.get('/requests/my-requests');
                const collected = requests.filter(r => 
                    r.status === 'COLLECTED' || r.status === 'COMPLETED' || (r.collection && r.collection.status === 'COMPLETED')
                );
                renderCollections(collected);
            } catch (error) {
                container.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">Failed to load collections</h5>
                        <p class="text-muted">${error.message}</p>
                        <button class="btn btn-primary mt-3" onclick="loadCollections()">Retry</button>
                    </div>
                `;
            }
        }

        function renderCollections(collections) {
            const container = document.getElementById('collections-list');

            if (!collections || collections.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-truck text-muted" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">No collections yet</h5>
                        <p class="text-muted">Completed collections will appear here</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Food</th>
                                <th>Donor</th>
                                <th>Collected Qty</th>
                                <th>Collection Time</th>
                                <th>Status</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${collections.map(r => `
                                <tr>
                                    <td>
                                        <strong>${escapeHtml(r.donationFoodName)}</strong>
                                        <div class="text-muted small">Requested: ${r.requestedQuantity} ${escapeHtml(r.unit || 'portions')}</div>
                                    </td>
                                    <td>${escapeHtml(r.donorName || 'Unknown')}</td>
                                    <td>${r.collection?.collectedQuantity || r.requestedQuantity} ${escapeHtml(r.unit || 'portions')}</td>
                                    <td>${r.collection ? formatDate(r.collection.collectionTime) : '-'}</td>
                                    <td><span class="badge badge-${getStatusBadgeClass(r.status)}">${getStatusLabel(r.status)}</span></td>
                                    <td>${escapeHtml(r.collection?.remarks || '-')}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
    </script>
</body>
</html>
