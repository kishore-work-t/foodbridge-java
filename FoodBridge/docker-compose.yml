version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: foodbridge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: foodbridge_db
    ports:
      - "3306:3306"
    volumes:
      - foodbridge_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - foodbridge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodbridge-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/foodbridge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password123
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:80,http://localhost"
      JWT_SECRET: "Zm9vZGJyaWRnZS1zdXBlci1zZWNyZXQta2V5LTI1Ni1iaXQtdG9rZW4tcHJvZHVjdGlvbiE="
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - foodbridge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodbridge-frontend
    restart: unless-stopped
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8080
    ports:
      - "5500:80"
    depends_on:
      - backend
    networks:
      - foodbridge-net

volumes:
  foodbridge_mysql_data:

networks:
  foodbridge-net:
    driver: bridge
